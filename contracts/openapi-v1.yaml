{
  "components": {
    "schemas": {
      "AdapterRef": {
        "additionalProperties": false,
        "properties": {
          "id": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Id",
            "type": "string"
          },
          "version": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Version",
            "type": "string"
          }
        },
        "required": [
          "id",
          "version"
        ],
        "title": "AdapterRef",
        "type": "object"
      },
      "AdapterRequest": {
        "additionalProperties": false,
        "properties": {
          "operation": {
            "enum": [
              "validate_input",
              "split",
              "verify",
              "aggregate"
            ],
            "title": "Operation",
            "type": "string"
          },
          "payload": {
            "additionalProperties": true,
            "title": "Payload",
            "type": "object"
          }
        },
        "required": [
          "operation",
          "payload"
        ],
        "title": "AdapterRequest",
        "type": "object"
      },
      "AdapterResponse": {
        "additionalProperties": false,
        "properties": {
          "error": {
            "anyOf": [
              {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Error"
          },
          "result": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "default": null,
            "title": "Result"
          }
        },
        "title": "AdapterResponse",
        "type": "object"
      },
      "Artifact": {
        "additionalProperties": false,
        "properties": {
          "id": {
            "format": "uuid",
            "title": "Id",
            "type": "string"
          },
          "media_type": {
            "maxLength": 256,
            "minLength": 1,
            "title": "Media Type",
            "type": "string"
          },
          "name": {
            "maxLength": 512,
            "minLength": 1,
            "title": "Name",
            "type": "string"
          },
          "sha256": {
            "pattern": "^[a-f0-9]{64}$",
            "title": "Sha256",
            "type": "string"
          },
          "size_bytes": {
            "minimum": 0.0,
            "title": "Size Bytes",
            "type": "integer"
          }
        },
        "required": [
          "id",
          "name",
          "size_bytes",
          "sha256",
          "media_type"
        ],
        "title": "Artifact",
        "type": "object"
      },
      "Assignment": {
        "additionalProperties": false,
        "properties": {
          "accelerator": {
            "enum": [
              "cpu",
              "cuda"
            ],
            "title": "Accelerator",
            "type": "string"
          },
          "adapter": {
            "$ref": "#/components/schemas/AdapterRef"
          },
          "argv": {
            "items": {
              "type": "string"
            },
            "title": "Argv",
            "type": "array"
          },
          "attempt_id": {
            "format": "uuid",
            "title": "Attempt Id",
            "type": "string"
          },
          "checkpoint_compatibility_digest": {
            "anyOf": [
              {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Checkpoint Compatibility Digest"
          },
          "generation": {
            "exclusiveMinimum": 0.0,
            "title": "Generation",
            "type": "integer"
          },
          "heartbeat_interval_ms": {
            "exclusiveMinimum": 0.0,
            "title": "Heartbeat Interval Ms",
            "type": "integer"
          },
          "image_digest": {
            "maxLength": 256,
            "pattern": "^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$",
            "title": "Image Digest",
            "type": "string"
          },
          "inputs": {
            "items": {
              "$ref": "#/components/schemas/AssignmentInput"
            },
            "title": "Inputs",
            "type": "array"
          },
          "item_ids": {
            "items": {
              "maxLength": 256,
              "minLength": 1,
              "type": "string"
            },
            "title": "Item Ids",
            "type": "array"
          },
          "job_id": {
            "format": "uuid",
            "title": "Job Id",
            "type": "string"
          },
          "lease_expires_at": {
            "format": "date-time",
            "title": "Lease Expires At",
            "type": "string"
          },
          "lease_remaining_ms": {
            "minimum": 0.0,
            "title": "Lease Remaining Ms",
            "type": "integer"
          },
          "lease_token": {
            "maxLength": 128,
            "minLength": 32,
            "title": "Lease Token",
            "type": "string"
          },
          "manifest_digest": {
            "pattern": "^[a-f0-9]{64}$",
            "title": "Manifest Digest",
            "type": "string"
          },
          "network_policy": {
            "const": "none",
            "title": "Network Policy",
            "type": "string"
          },
          "outputs": {
            "items": {
              "$ref": "#/components/schemas/Output"
            },
            "title": "Outputs",
            "type": "array"
          },
          "parameters": {
            "additionalProperties": true,
            "title": "Parameters",
            "type": "object"
          },
          "platform": {
            "title": "Platform",
            "type": "string"
          },
          "resource_limits": {
            "$ref": "#/components/schemas/Resources"
          },
          "resume_checkpoint": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Artifact"
              },
              {
                "type": "null"
              }
            ]
          },
          "stage_id": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Stage Id",
            "type": "string"
          },
          "task_deadline_at": {
            "format": "date-time",
            "title": "Task Deadline At",
            "type": "string"
          },
          "task_id": {
            "format": "uuid",
            "title": "Task Id",
            "type": "string"
          },
          "validator_policy": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Validator Policy",
            "type": "string"
          },
          "variant_id": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Variant Id",
            "type": "string"
          },
          "working_dir": {
            "maxLength": 512,
            "minLength": 1,
            "title": "Working Dir",
            "type": "string"
          }
        },
        "required": [
          "generation",
          "lease_token",
          "job_id",
          "stage_id",
          "task_id",
          "attempt_id",
          "variant_id",
          "lease_expires_at",
          "lease_remaining_ms",
          "heartbeat_interval_ms",
          "task_deadline_at",
          "manifest_digest",
          "adapter",
          "image_digest",
          "platform",
          "accelerator",
          "argv",
          "working_dir",
          "inputs",
          "outputs",
          "resource_limits",
          "network_policy",
          "validator_policy",
          "item_ids",
          "parameters"
        ],
        "title": "Assignment",
        "type": "object"
      },
      "AssignmentInput": {
        "additionalProperties": false,
        "properties": {
          "archive": {
            "default": false,
            "title": "Archive",
            "type": "boolean"
          },
          "artifact": {
            "$ref": "#/components/schemas/Artifact"
          },
          "artifact_id": {
            "format": "uuid",
            "title": "Artifact Id",
            "type": "string"
          },
          "mount_path": {
            "maxLength": 512,
            "minLength": 1,
            "title": "Mount Path",
            "type": "string"
          }
        },
        "required": [
          "artifact_id",
          "mount_path",
          "artifact"
        ],
        "title": "AssignmentInput",
        "type": "object"
      },
      "AttemptProof": {
        "additionalProperties": false,
        "properties": {
          "generation": {
            "exclusiveMinimum": 0.0,
            "title": "Generation",
            "type": "integer"
          },
          "lease_token": {
            "maxLength": 128,
            "minLength": 32,
            "title": "Lease Token",
            "type": "string"
          }
        },
        "required": [
          "generation",
          "lease_token"
        ],
        "title": "AttemptProof",
        "type": "object"
      },
      "AttemptStatus": {
        "additionalProperties": false,
        "properties": {
          "attempt_id": {
            "format": "uuid",
            "title": "Attempt Id",
            "type": "string"
          },
          "error_code": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Error Code"
          },
          "generation": {
            "exclusiveMinimum": 0.0,
            "title": "Generation",
            "type": "integer"
          },
          "receipt": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/CompletionReceipt"
              },
              {
                "type": "null"
              }
            ]
          },
          "state": {
            "$ref": "#/components/schemas/TaskState"
          },
          "task_id": {
            "format": "uuid",
            "title": "Task Id",
            "type": "string"
          }
        },
        "required": [
          "attempt_id",
          "task_id",
          "generation",
          "state"
        ],
        "title": "AttemptStatus",
        "type": "object"
      },
      "AttemptTelemetry": {
        "additionalProperties": false,
        "properties": {
          "cpu_percent": {
            "anyOf": [
              {
                "maximum": 100.0,
                "minimum": 0.0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Cpu Percent"
          },
          "generation": {
            "exclusiveMinimum": 0.0,
            "title": "Generation",
            "type": "integer"
          },
          "gpu_percent": {
            "anyOf": [
              {
                "maximum": 100.0,
                "minimum": 0.0,
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Gpu Percent"
          },
          "lease_token": {
            "maxLength": 128,
            "minLength": 32,
            "title": "Lease Token",
            "type": "string"
          },
          "memory_bytes": {
            "anyOf": [
              {
                "minimum": 0.0,
                "type": "integer"
              },
              {
                "type": "null"
              }
            ],
            "title": "Memory Bytes"
          },
          "phase": {
            "enum": [
              "idle",
              "transfer",
              "start",
              "compute",
              "verify",
              "aggregate"
            ],
            "title": "Phase",
            "type": "string"
          },
          "sequence": {
            "minimum": 0.0,
            "title": "Sequence",
            "type": "integer"
          }
        },
        "required": [
          "generation",
          "lease_token",
          "sequence",
          "phase"
        ],
        "title": "AttemptTelemetry",
        "type": "object"
      },
      "BenchmarkCreate": {
        "additionalProperties": false,
        "properties": {
          "batch_policy": {
            "additionalProperties": {
              "exclusiveMinimum": 0.0,
              "type": "integer"
            },
            "maxProperties": 16,
            "title": "Batch Policy",
            "type": "object"
          },
          "concurrency": {
            "maximum": 512.0,
            "minimum": 1.0,
            "title": "Concurrency",
            "type": "integer"
          },
          "node_ids": {
            "items": {
              "format": "uuid",
              "type": "string"
            },
            "maxItems": 32,
            "minItems": 2,
            "title": "Node Ids",
            "type": "array"
          },
          "plan_revision": {
            "exclusiveMinimum": 0.0,
            "title": "Plan Revision",
            "type": "integer"
          },
          "preview_id": {
            "format": "uuid",
            "title": "Preview Id",
            "type": "string"
          },
          "repetitions": {
            "default": 3,
            "maximum": 20.0,
            "minimum": 3.0,
            "title": "Repetitions",
            "type": "integer"
          },
          "warm": {
            "default": true,
            "title": "Warm",
            "type": "boolean"
          }
        },
        "required": [
          "preview_id",
          "plan_revision",
          "node_ids",
          "concurrency"
        ],
        "title": "BenchmarkCreate",
        "type": "object"
      },
      "BenchmarkReport": {
        "additionalProperties": false,
        "properties": {
          "config": {
            "$ref": "#/components/schemas/BenchmarkCreate"
          },
          "config_digest": {
            "pattern": "^[a-f0-9]{64}$",
            "title": "Config Digest",
            "type": "string"
          },
          "efficiency_percent": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Efficiency Percent"
          },
          "id": {
            "format": "uuid",
            "title": "Id",
            "type": "string"
          },
          "manifest_digest": {
            "pattern": "^[a-f0-9]{64}$",
            "title": "Manifest Digest",
            "type": "string"
          },
          "pooled_units_per_second": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Pooled Units Per Second"
          },
          "service_job_ids": {
            "items": {
              "format": "uuid",
              "type": "string"
            },
            "title": "Service Job Ids",
            "type": "array"
          },
          "service_runs": {
            "items": {
              "additionalProperties": true,
              "type": "object"
            },
            "title": "Service Runs",
            "type": "array"
          },
          "speedup": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Speedup"
          },
          "standalone_results": {
            "items": {
              "$ref": "#/components/schemas/StandaloneRecord"
            },
            "title": "Standalone Results",
            "type": "array"
          },
          "standalone_units_per_second": {
            "additionalProperties": {
              "type": "number"
            },
            "title": "Standalone Units Per Second",
            "type": "object"
          },
          "status": {
            "enum": [
              "collecting",
              "running",
              "complete",
              "failed"
            ],
            "title": "Status",
            "type": "string"
          }
        },
        "required": [
          "id",
          "config",
          "config_digest",
          "manifest_digest",
          "status",
          "standalone_results",
          "service_job_ids",
          "standalone_units_per_second",
          "service_runs"
        ],
        "title": "BenchmarkReport",
        "type": "object"
      },
      "Budget": {
        "additionalProperties": false,
        "properties": {
          "cpu_millis": {
            "minimum": 0.0,
