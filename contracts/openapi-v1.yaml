            "title": "Sha256",
            "type": "string"
          },
          "size_bytes": {
            "exclusiveMinimum": 0.0,
            "title": "Size Bytes",
            "type": "integer"
          }
        },
        "required": [
          "number",
          "sha256",
          "size_bytes"
        ],
        "title": "UploadPart",
        "type": "object"
      },
      "Variant": {
        "additionalProperties": false,
        "properties": {
          "accelerator": {
            "enum": [
              "cpu",
              "cuda"
            ],
            "title": "Accelerator",
            "type": "string"
          },
          "image_digest": {
            "maxLength": 256,
            "pattern": "^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$",
            "title": "Image Digest",
            "type": "string"
          },
          "platform": {
            "enum": [
              "linux/amd64",
              "linux/arm64"
            ],
            "title": "Platform",
            "type": "string"
          },
          "resource_requirements": {
            "$ref": "#/components/schemas/Resources"
          },
          "variant_id": {
            "pattern": "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$",
            "title": "Variant Id",
            "type": "string"
          }
        },
        "required": [
          "variant_id",
          "image_digest",
          "platform",
          "accelerator",
          "resource_requirements"
        ],
        "title": "Variant",
        "type": "object"
      },
      "WorkRequest": {
        "additionalProperties": false,
        "properties": {
          "wait_ms": {
            "default": 25000,
            "maximum": 25000.0,
            "minimum": 0.0,
            "title": "Wait Ms",
            "type": "integer"
          }
        },
        "title": "WorkRequest",
        "type": "object"
      }
    },
    "securitySchemes": {
      "Bearer": {
        "scheme": "bearer",
        "type": "http"
      },
      "BrowserSession": {
        "in": "cookie",
        "name": "campus_session",
        "type": "apiKey"
      }
    }
  },
