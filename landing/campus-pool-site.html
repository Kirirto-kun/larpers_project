<title>larpool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { obsidian: '#0B0F0E', moss: '#102A22', cream: '#F3F4F1', mint: '#4DE8B0', mintink: '#12996A', amber: '#F0A35E' },
      fontFamily: { sans: ['Geist', 'Inter', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] }
    } }
  };
</script>
<style>
/* Layout: one long scroll. A single persistent 3D sphere starts in the hero, leans toward the cursor, then travels
   down with the scroll and docks as the core of "One request. Six roles." Dark obsidian top with pointer light,
   a tech marquee, then cream sections (scroll-driven layer stack, numbers + live run, pricing, questions),
   dark contribute band and footer. Single committed look; every color is set explicitly. */
:root{ --obsidian:#0B0F0E; --moss:#102A22; --cream:#F3F4F1; --mint:#4DE8B0; --mintink:#12996A; --fg:#E8EEEA; --mx:70%; --my:40%; color-scheme:dark; }
html{background:var(--obsidian);scroll-behavior:smooth}
body{background:var(--obsidian);color:var(--fg);font-family:Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--obsidian)}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.ambient{background:
  radial-gradient(560px circle at var(--mx) var(--my), rgba(77,232,176,.10), transparent 60%),
  radial-gradient(900px 600px at 78% 30%, rgba(16,42,34,.95), transparent 70%),
  radial-gradient(700px 500px at 10% 90%, rgba(16,42,34,.7), transparent 70%),
  var(--obsidian)}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 30%,transparent 80%)}
#sphere{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.comet{stroke-dasharray:70 930;animation:comet 3.2s linear infinite}
@keyframes blink{50%{opacity:.3}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes marquee{to{transform:translateX(-50%)}}
.marquee{animation:marquee 38s linear infinite}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.eq span{display:block;width:3px;background:#4DE8B0;border-radius:2px;transform-origin:bottom;animation:bar 1.1s ease-in-out infinite}
@keyframes scrolldot{0%{transform:translateY(0);opacity:1}80%{transform:translateY(14px);opacity:0}100%{opacity:0}}
.scrolldot{animation:scrolldot 1.8s ease-in-out infinite}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const { useState, useEffect, useRef, useLayoutEffect } = React;
const html = htm.bind(React.createElement);
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const FM = window.Motion || {};
const MOTION_PROPS = ['initial','animate','exit','whileInView','whileHover','whileTap','transition','viewport','layout','variants'];
const motion = FM.motion || new Proxy({}, { get: (_, tag) => React.forwardRef((p, ref) => { const q = Object.assign({}, p); MOTION_PROPS.forEach(k => delete q[k]); q.ref = ref; return React.createElement(tag, q); }) });
const AnimatePresence = FM.AnimatePresence || (({ children }) => children);
const EASE = [0.2, 0.8, 0.2, 1];

/* shared pointer state */
const PTR = { x: innerWidth*.7, y: innerHeight*.45, vx: 0, vy: 0, down: 0 };
addEventListener('pointermove', e => {
  PTR.vx = e.clientX - PTR.x; PTR.vy = e.clientY - PTR.y; PTR.x = e.clientX; PTR.y = e.clientY;
  document.documentElement.style.setProperty('--mx', e.clientX + 'px'); document.documentElement.style.setProperty('--my', e.clientY + 'px');
}, { passive: true });
addEventListener('pointerdown', () => { PTR.down = performance.now(); }, { passive: true });

function useInView(ref, amount){
  const [v, setV] = useState(false);
  useEffect(() => { if (!ref.current || !('IntersectionObserver' in window)) { setV(true); return; }
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setV(true); io.disconnect(); } }, { threshold: amount || 0.3 });
    io.observe(ref.current); return () => io.disconnect(); }, []);
  return v;
}
/* 0..1 progress of an element passing through the viewport */
function useProgress(ref){
  const [p, setP] = useState(0);
  useEffect(() => { const on = () => { const el = ref.current; if (!el) return; const r = el.getBoundingClientRect(); setP(Math.max(0, Math.min(1, (innerHeight - r.top) / (innerHeight + r.height)))); };
    on(); addEventListener('scroll', on, { passive: true }); addEventListener('resize', on); return () => { removeEventListener('scroll', on); removeEventListener('resize', on); }; }, []);
  return p;
}

const Reveal = ({ children, className, delay, y }) => html`<${motion.div} className=${className} initial=${{ opacity: 0.2, y: y == null ? 28 : y }} whileInView=${{ opacity: 1, y: 0 }} viewport=${{ once: true, amount: 0.2 }} transition=${{ duration: 0.7, delay: delay || 0, ease: EASE }}>${children}<//>`;

/* headline that rises word by word */
function Words({ text, className, accent, delay, light, as }){
  const words = text.split(' '), acc = (accent || '').split(' ').filter(Boolean), Tag = as || 'h2';
  const all = words.map(w => [w, false]).concat(acc.map(w => [w, true]));
  return html`<${Tag} className=${className}>${all.map(([w, a], i) => html`<span key=${i} className="inline-block overflow-hidden pb-[.08em] align-bottom"><${motion.span} className=${'inline-block ' + (a ? (light ? 'text-mintink' : 'text-mint') : '')}
      initial=${{ y: '105%' }} whileInView=${{ y: '0%' }} viewport=${{ once: true, amount: 0.6 }} transition=${{ duration: 0.75, delay: (delay || 0) + i*0.05, ease: EASE }}>${w}<//>${i < all.length - 1 ? '\u00a0' : ''}</span>`)}<//>`;
}

/* magnetic button */
const Arrow = () => html`<span className="inline-block transition-transform duration-200 ease-out group-hover:translate-x-0.5 group-hover:-translate-y-0.5">↗</span>`;
function Btn({ href, children, kind }){
  const ref = useRef(null); const [o, setO] = useState({ x: 0, y: 0 });
  const move = e => { if (REDUCE) return; const r = ref.current.getBoundingClientRect(); setO({ x: (e.clientX - r.left - r.width/2)*.25, y: (e.clientY - r.top - r.height/2)*.35 }); };
  const base = 'group inline-flex items-center gap-3 rounded-full px-5 py-3 text-[15px] font-medium transition-colors duration-200 ease-out';
  const look = kind === 'ghost' ? 'border border-white/15 text-white/90 hover:border-mint hover:text-mint bg-white/[.02]'
    : kind === 'dark' ? 'bg-obsidian text-white hover:bg-black' : kind === 'line' ? 'border border-black/15 text-obsidian hover:border-obsidian'
    : 'bg-mint text-obsidian hover:bg-[#7DF0C6] shadow-[0_0_30px_-8px_rgba(77,232,176,.7)]';
  return html`<${motion.a} ref=${ref} href=${href} onMouseMove=${move} onMouseLeave=${() => setO({ x: 0, y: 0 })} className=${base + ' ' + look}
    animate=${{ x: o.x, y: o.y }} whileTap=${{ scale: 0.96 }} transition=${{ type: 'spring', stiffness: 300, damping: 18, mass: .4 }}>${children} <${Arrow}/><//>`;
}
const Eyebrow = ({ children, light }) => html`<span className=${'inline-flex items-center gap-3 font-mono text-[12px] uppercase tracking-[.14em] ' + (light ? 'text-black/50' : 'text-white/50')}><span className=${'h-px w-8 ' + (light ? 'bg-mintink' : 'bg-mint')}></span>${children}</span>`;

/* ---------------- The one sphere: hero -> travels -> docks in the roles core ---------------- */
const VS = `
uniform float uTime; uniform vec3 uHit; uniform float uHitS; uniform float uPulse; uniform float uDpr; uniform float uVel; uniform float uShock;
attribute float aRand; varying float vGlow; varying float vDepth;
void main(){
  vec3 p = position;
  float d = distance(normalize(p), normalize(uHit));
  float ripple = sin(d*18.0 - uTime*6.0) * exp(-d*2.8) * uHitS * (0.06 + uVel*0.10);
  float bulge = exp(-d*d*14.0) * uHitS * (0.16 + uVel*0.14);
  float shock = uShock > 0.0 ? exp(-pow(d - (1.0-uShock)*2.4, 2.0)*30.0) * uShock * 0.22 : 0.0;
  float breathe = sin(uTime*0.8 + aRand*6.2831) * 0.012;
  p *= 1.0 + ripple + bulge + shock + breathe + uPulse*0.05;
  vGlow = exp(-d*d*8.0)*uHitS*(1.0 + uVel) + shock*3.0 + uPulse*0.3;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vDepth = clamp((-mv.z - (cameraPosition.z - 1.0)) / 2.0, 0.0, 1.0);
  gl_PointSize = (1.6 + vGlow*4.5 + aRand*0.7) * uDpr * (cameraPosition.z / -mv.z) * max(0.6, modelMatrix[0][0]*0.9);
  gl_Position = projectionMatrix * mv;
}`;
const FS = `
varying float vGlow; varying float vDepth;
void main(){
  vec2 c = gl_PointCoord - 0.5; float r = length(c); if (r > 0.5) discard;
  float soft = smoothstep(0.5, 0.0, r);
  vec3 col = mix(vec3(0.55,0.95,0.78), vec3(0.30,0.91,0.69), clamp(vGlow,0.0,1.0));
  col = mix(col, vec3(1.0), clamp(vGlow-0.8,0.0,1.0));
  float a = soft * mix(0.95, 0.15, vDepth) * (0.5 + vGlow*0.9);
  gl_FragColor = vec4(col, a);
}`;

function TravelSphere({ heroSlot, coreSlot }){
  const cv = useRef(null);
  useEffect(() => {
    const T = window.THREE, canvas = cv.current; if (!T || !canvas) return;
    let renderer; try { renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { return; }
    const dpr = Math.min(2, devicePixelRatio || 1); renderer.setPixelRatio(dpr);
    const FOV = 35, CZ = 6, scene = new T.Scene(), cam = new T.PerspectiveCamera(FOV, 1, 0.1, 60); cam.position.z = CZ;
    const root = new T.Group(), spin = new T.Group(); root.add(spin); scene.add(root);
    const N = innerWidth < 700 ? 1800 : 3200, pos = new Float32Array(N*3), rnd = new Float32Array(N);
    for (let i = 0; i < N; i++){ const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), th = i*2.399963; pos[i*3] = Math.cos(th)*r; pos[i*3+1] = y; pos[i*3+2] = Math.sin(th)*r; rnd[i] = Math.random(); }
    const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.BufferAttribute(pos, 3)); geo.setAttribute('aRand', new T.BufferAttribute(rnd, 1));
    const uni = { uTime:{value:0}, uHit:{value:new T.Vector3(0,0,1)}, uHitS:{value:0}, uPulse:{value:0}, uDpr:{value:dpr}, uVel:{value:0}, uShock:{value:0} };
    spin.add(new T.Points(geo, new T.ShaderMaterial({ uniforms: uni, vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, blending: T.AdditiveBlending })));
    const gc = document.createElement('canvas'); gc.width = gc.height = 128; const g2 = gc.getContext('2d'); const grd = g2.createRadialGradient(64,64,0,64,64,64);
    grd.addColorStop(0,'rgba(77,232,176,.36)'); grd.addColorStop(.45,'rgba(16,90,60,.16)'); grd.addColorStop(1,'rgba(0,0,0,0)'); g2.fillStyle = grd; g2.fillRect(0,0,128,128);
    const glowMat = new T.SpriteMaterial({ map: new T.CanvasTexture(gc), blending: T.AdditiveBlending, depthWrite: false, transparent: true });
    const spr = new T.Sprite(glowMat); spr.scale.setScalar(3.6); root.add(spr);
    const rings = new T.Group(); root.add(rings);
    [[1.42,.36,.32,.25,.45],[1.2,1.14,-.5,.9,.22],[.3,1.3,.15,-.2,.38]].forEach(([rx,ry,rz,rxr,op]) => {
      const pts = new T.EllipseCurve(0,0,rx,ry,0,Math.PI*2).getPoints(200).map(v => new T.Vector3(v.x, v.y, 0));
      const ln = new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({ color: 0x4de8b0, transparent: true, opacity: op }));
      ln.rotation.z = rz; ln.rotation.x = rxr; ln.userData.op = op; rings.add(ln); });
    const ray = new T.Raycaster(), ndc = new T.Vector2(), sph = new T.Sphere(new T.Vector3(), 1), hit = new T.Vector3();
    const resize = () => { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); };
    resize(); addEventListener('resize', resize);
    const st = { x: 0, y: 0, s: 1, lx: 0, ly: 0 }; let spinA = 0, last = performance.now(), raf, hidden = false;
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
    const loop = now => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(.05, (now - last)/1000); last = now;
      const hs = heroSlot.current, cs = coreSlot.current; if (!hs || !cs) return;
      const h = hs.getBoundingClientRect(), c = cs.getBoundingClientRect();
      const D = (c.top + scrollY + c.height/2) - innerHeight/2;            // scroll distance until the core is centred
      const p = Math.max(0, Math.min(1, scrollY / Math.max(1, D))), e = ease(p);
      const hx = h.left + h.width/2, hy = h.top + scrollY + h.height/2;   // hero spot, held on screen while travelling
      const cx = c.left + c.width/2, cy = c.top + c.height/2;
      let tx = hx + (cx - hx)*e, ty = hy + (cy - hy)*e, ts = (h.width + (c.width - h.width)*e) * .36;
      if (p >= 1){ tx = cx; ty = cy; ts = c.width*.36; }
      // lean toward the pointer (strong in the hero, gentle once docked)
      const lean = .12 - .08*e; st.lx += ((PTR.x - tx)*lean - st.lx)*.08; st.ly += ((PTR.y - ty)*lean - st.ly)*.08;
      // mid-flight swing so the trip reads as a journey
      const swing = Math.sin(e*Math.PI) * Math.min(innerWidth*.12, 160);
      tx += st.lx - swing; ty += st.ly;
      st.x += (tx - st.x)*.18; st.y += (ty - st.y)*.18; st.s += (ts - st.s)*.18;
      const off = st.y + st.s < -40 || st.y - st.s > innerHeight + 40;
      if (off){ if (!hidden){ renderer.clear(); hidden = true; } return; } hidden = false;
      const wpp = (2*Math.tan(FOV*Math.PI/360)*CZ) / innerHeight;
      root.position.set((st.x - innerWidth/2)*wpp, -(st.y - innerHeight/2)*wpp, 0);
      const R = st.s*wpp; root.scale.setScalar(R); sph.center.copy(root.position); sph.radius = R;
      // spin + pointer-driven tilt, with inertia
      if (!REDUCE) spinA += dt*(.1 + Math.min(1.5, Math.hypot(PTR.vx, PTR.vy)*.01));
      const mx = PTR.x/innerWidth - .5, my = PTR.y/innerHeight - .5;
      spin.rotation.y += ((spinA + mx*1.4) - spin.rotation.y)*.1; spin.rotation.x += ((my*.8 + e*.6) - spin.rotation.x)*.1;
      rings.rotation.y = spin.rotation.y*.35; rings.rotation.x = spin.rotation.x*.6 + e*.4; rings.rotation.z = REDUCE ? 0 : now*.00008;
      rings.children.forEach(l => { l.material.opacity = l.userData.op*(1 - e*.35); });
      // cursor hit, speed and click shockwave
      ndc.set((PTR.x/innerWidth)*2 - 1, -(PTR.y/innerHeight)*2 + 1); ray.setFromCamera(ndc, cam);
      let target = 0;
      if (ray.ray.intersectSphere(sph, hit)){ uni.uHit.value.lerp(spin.worldToLocal(hit.clone()).normalize(), .4); target = 1; }
      else { const dpx = Math.hypot(PTR.x - st.x, PTR.y - st.y); if (dpx < st.s*1.8){ target = 1 - (dpx - st.s)/(st.s*.8); target = Math.max(0, Math.min(1, target)); } }
      uni.uHitS.value += (target - uni.uHitS.value)*.14;
      const vel = Math.min(1, Math.hypot(PTR.vx, PTR.vy)/40); uni.uVel.value += (vel - uni.uVel.value)*.1; PTR.vx *= .85; PTR.vy *= .85;
      const since = (now - PTR.down)/900; uni.uShock.value = since >= 0 && since < 1 ? 1 - since : 0;
      uni.uPulse.value *= .94; uni.uTime.value = REDUCE ? 0 : now/1000;
      renderer.render(scene, cam);
    };
    raf = requestAnimationFrame(loop);
    window.__pulseSphere = v => { uni.uPulse.value = Math.max(uni.uPulse.value, v || 1); };
    window.__aimSphere = (lat, lon) => { if (lat == null){ return; } const la = lat*Math.PI/180, lo = lon*Math.PI/180; uni.uHit.value.set(Math.cos(la)*Math.cos(lo), Math.sin(la), Math.cos(la)*Math.sin(lo)); uni.uHitS.value = 1; };
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', resize); renderer.dispose(); };
  }, []);
  return html`<canvas id="sphere" ref=${cv} aria-hidden="true"></canvas>`;
}

/* ---------------- larpool logo: an l flowing into a p ---------------- */
const MARK_L = 'M2 0H24Q26 0 26 2V34C26 50 40 58 57 61C44 62 36 64 28 68C12 75 0 66 0 50V2Q0 0 2 0Z';
const MARK_P = 'M38 28H88C106 28 120 44 120 63C120 82 106 97 88 97H58V120Q58 122 56 122H32Q30 122 30 120V86C30 74 40 67 56 67H86C90 67 92 64 92 59C92 54 90 51 86 51H57C46 51 36 46 33 36V32Q33 28 38 28Z';
function Mark({ className, draw }){
  return html`<svg viewBox="-2 -2 124 126" className=${className} aria-hidden="true">
    <${motion.path} d=${MARK_L} fill="#4DE8B0" initial=${draw ? { opacity: 0, y: -10 } : false} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: .7, ease: EASE }}/>
    <${motion.path} d=${MARK_P} fill="#4DE8B0" initial=${draw ? { opacity: 0, y: 10 } : false} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: .7, delay: .12, ease: EASE }}/>
  </svg>`;
}
function Logo({ size }){
  const big = size === 'lg';
  return html`<span className="flex items-center gap-2.5"><${Mark} draw=${!big} className=${big ? 'h-9 w-9' : 'h-7 w-7'}/><span className=${(big ? 'text-[26px]' : 'text-[22px]') + ' font-medium leading-none tracking-[-0.035em] text-[#EDEEEA]'}>larpool</span></span>`;
}

/* ---------------- Nav + progress ---------------- */
function Nav(){
  const [p, setP] = useState(0);
  useEffect(() => { const on = () => setP(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)); on(); addEventListener('scroll', on, { passive: true }); return () => removeEventListener('scroll', on); }, []);
  const links = [['Platform','#roles'],['How it works','#layers'],['Reliability','#numbers'],['Pricing','#pricing'],['Questions','#faq']];
  return html`<header className="fixed inset-x-0 top-0 z-50 border-b border-white/[.06] bg-obsidian/60 backdrop-blur-xl" style=${{ paddingTop: 'env(safe-area-inset-top,0px)' }}>
    <div className="gutter mx-auto grid h-16 max-w-[1240px] grid-cols-[1fr_auto] items-center gap-6 md:grid-cols-[1fr_auto_1fr]">
      <a href="#top" aria-label="larpool home"><${Logo}/></a>
      <nav className="hidden gap-8 md:flex" aria-label="Sections">${links.map(([t, h]) => html`<a key=${t} href=${h} className="group relative text-[14px] text-white/65 transition-colors duration-200 ease-out hover:text-white">${t}<span className="absolute -bottom-1 left-0 h-px w-0 bg-mint transition-all duration-300 ease-out group-hover:w-full"></span></a>`)}</nav>
      <div className="flex justify-end"><${Btn} href="#join">Lend a laptop<//></div>
    </div>
    <div className="h-px origin-left bg-mint shadow-[0_0_10px_#4DE8B0]" style=${{ transform: 'scaleX(' + p + ')' }}></div>
  </header>`;
}

/* ---------------- Hero ---------------- */
function Hero({ slot }){
  const lines = [['Laptops', 'that'], ['work', 'as', 'one.']];
  return html`<section id="top" className="ambient relative overflow-hidden pt-28 md:pt-32">
    <div className="grid-bg pointer-events-none absolute inset-0"></div>
    <div className="gutter relative mx-auto grid min-h-[min(88svh,820px)] max-w-[1240px] items-center gap-6 md:grid-cols-[1.05fr_.95fr]">
      <div className="relative z-10 flex flex-col gap-7">
        <h1 className="text-[clamp(3rem,7vw,6rem)] font-semibold leading-[.98] tracking-[-0.05em] text-white">
          ${lines.map((ln, li) => html`<span key=${li} className="block">${ln.map((w, wi) => html`<span key=${wi} className="inline-block overflow-hidden pb-[.06em] align-bottom"><${motion.span} className=${'inline-block ' + (li ? 'text-mint' : '')}
            initial=${{ y: '110%', rotate: 4 }} animate=${{ y: '0%', rotate: 0 }} transition=${{ duration: .9, delay: .15 + (li*2 + wi)*.08, ease: EASE }}>${w}<//>${wi < ln.length - 1 ? '\u00a0' : ''}</span>`)}</span>`)}
        </h1>
        <${motion.p} className="max-w-[44ch] text-[17px] leading-relaxed text-white/60" initial=${{ opacity: 0, y: 14 }} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: .8, delay: .55, ease: EASE }}>Describe a compute task or bring your code. Your team’s available laptops run it and return the results.<//>
        <${motion.div} className="flex flex-wrap gap-3" initial=${{ opacity: 0, y: 14 }} animate=${{ opacity: 1, y: 0 }} transition=${{ duration: .8, delay: .7, ease: EASE }}><${Btn} href="#roles">Run a task<//><${Btn} href="#join" kind="ghost">Contribute compute<//><//>
      </div>
      <div ref=${slot} className="order-first mx-auto aspect-square w-full max-w-[320px] md:order-none md:max-w-[600px]" aria-hidden="true"></div>
    </div>
    <div className="gutter relative mx-auto flex max-w-[1240px] items-center justify-between gap-4 pb-8">
    </div>
  </section>`;
}

/* ---------------- Marquee ---------------- */
function Marquee(){

const LAYERS = [
  ['Portal', 'Run a task or lend a laptop. Plan preview, live progress, downloads.'],
  ['Console', 'Devices, attempts, retries and matched benchmarks.'],
  ['Coordinator', 'FastAPI over trusted HTTPS. The one place that decides.'],

  ['Validator', 'A well-formed but wrong result does not count.']

function Layers(){
  const ref = useRef(null), stage = useRef(null); const p = useProgress(ref);
  const [sel, setSel] = useState(0); const [hov, setHov] = useState(-1);
  const cur = sel;   // pointing at a name in the list lifts its layer (and it stays); the 3D stack itself ignores the mouse
  const gap = 12 + Math.max(0, Math.min(1, (p - .1) / .4)) * 46;
  // the whole stack tilts toward the pointer, and each layer drifts by its depth
  useEffect(() => {
    let raf, lx = 0, ly = 0;
    const tick = () => { raf = requestAnimationFrame(tick); const el = stage.current; if (!el) return; const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      const tx = Math.max(-1, Math.min(1, (PTR.x - (r.left + r.width/2)) / (r.width*.6))), ty = Math.max(-1, Math.min(1, (PTR.y - (r.top + r.height/2)) / (r.height*.6)));
      lx += ((REDUCE ? 0 : tx) - lx)*.09; ly += ((REDUCE ? 0 : ty) - ly)*.09;
      el.style.setProperty('--lx', lx.toFixed(4)); el.style.setProperty('--ly', ly.toFixed(4)); };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, []);
  return html`<section id="layers" ref=${ref} className="relative overflow-hidden bg-cream py-28 text-obsidian md:py-36">
    <div className="gutter mx-auto max-w-[1240px]">
      <div className="mb-14 flex flex-col gap-5"><${Eyebrow} light>How it works<//>
        <${Words} text="Six parts." accent="One coordinator." light=${true} className="text-[clamp(2.4rem,5vw,4.4rem)] font-semibold leading-[1.0] tracking-[-0.045em]"/></div>
      <div className="grid items-center gap-12 lg:grid-cols-2">
        <div ref=${stage} className="relative h-[440px] md:h-[540px]" style=${{ perspective: '1600px', '--lx': 0, '--ly': 0 }}>
          <div className="absolute left-1/2 top-1/2 h-[220px] w-[220px] -translate-x-1/2 -translate-y-1/2 md:h-[290px] md:w-[290px]" style=${{ transformStyle: 'preserve-3d' }}>
            ${LAYERS.map((l, i) => { const on = cur === i, lift = on ? 46 : 0, z = (LAYERS.length - 1 - i)*gap - gap*2.5 + lift, depth = (2.5 - i)*18;
              return html`<div key=${l[0]} aria-hidden="true"
                className="pointer-events-none absolute inset-0 rounded-lg border"
                style=${{ transform: `translate3d(calc(var(--lx) * ${depth}px), calc(var(--ly) * ${depth*.7}px), 0) rotateX(calc(58deg - var(--ly) * 12deg)) rotateZ(calc(-42deg + var(--lx) * 18deg)) translateZ(${z.toFixed(1)}px)`, transition: 'background .35s, box-shadow .35s, border-color .35s', background: on ? '#4DE8B0' : '#0B0F0E', borderColor: on ? '#4DE8B0' : 'rgba(255,255,255,.08)', boxShadow: on ? '0 50px 90px -30px rgba(18,153,106,.75)' : '0 30px 60px -30px rgba(11,15,14,.5)' }}>
                <span className=${'pointer-events-none absolute bottom-3 left-3 font-mono text-[11px] ' + (on ? 'text-obsidian' : 'text-white/50')}>0${i + 1}</span>
                <span className=${'pointer-events-none absolute right-3 top-3 font-mono text-[11px] ' + (on ? 'text-obsidian' : 'text-white/50')}>${l[0]}</span>
                ${on && html`<span className="pointer-events-none absolute inset-3 rounded border border-obsidian/25"></span>`}</div>`; })}
          </div>
        </div>
        <div className="grid gap-x-8 sm:grid-cols-2">
          ${LAYERS.map((l, i) => html`<${motion.button} key=${l[0]} type="button" aria-pressed=${cur === i} onMouseEnter=${() => setSel(i)} onFocus=${() => setSel(i)} onClick=${() => setSel(i)}
            initial=${{ opacity: 0, y: 20 }} whileInView=${{ opacity: 1, y: 0 }} viewport=${{ once: true, amount: .5 }} transition=${{ duration: .6, delay: i*.06, ease: EASE }}
            className="group relative border-b border-black/10 py-5 text-left">

            <p className="mt-1 text-[14px] text-black/55">${l[1]}</p>
            <span className=${'absolute -bottom-px left-0 h-0.5 bg-mintink transition-all duration-500 ease-out ' + (cur === i ? 'w-full' : 'w-0')}></span>
          <//>`)}
        </div>
      </div>
    </div></section>`;
}

function Count({ to, suffix }){
  const ref = useRef(null); const seen = useInView(ref, 0.6); const [v, setV] = useState(to);
  useEffect(() => { if (!seen || REDUCE) return; let raf, s = performance.now(); const tick = n => { const p = Math.min(1, (n - s)/1500), e = 1 - Math.pow(1 - p, 3); setV(Math.round(to*e)); if (p < 1) raf = requestAnimationFrame(tick); }; setV(0); raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf); }, [seen]);
  return html`<span ref=${ref} className="tabular-nums">${v}<span className="ml-1 align-top text-[.38em] font-medium text-mintink">${suffix}</span></span>`;
}
const RUN = [

          <div className="text-[clamp(2.4rem,4vw,3.2rem)] font-semibold leading-none tracking-[-0.05em]">${p.p}<span className=${'ml-2 text-[15px] font-normal tracking-normal ' + (p.main ? 'text-white/50' : 'text-black/45')}>${p.s}</span></div>

      </div>
    </div></section>`;
}
