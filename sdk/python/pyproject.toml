[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "campus-pool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dto = ["pydantic==2.14.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "pydantic==2.14.3"]

[tool.hatch.build.targets.wheel]
packages = ["campus"]
